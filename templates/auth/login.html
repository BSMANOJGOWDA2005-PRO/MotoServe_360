{% extends 'base.html' %}

{% block title %}Login - MotoServe 360{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="glass-card p-4 p-md-5">
        <div class="text-center mb-4">
          <h3 class="fw-bold text-dark"><i class="fas fa-lock text-primary me-2"></i>Sign In</h3>
          <p class="text-muted small">Enter your credentials to access your dashboard</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST">
          <div class="mb-3">
            <label class="form-label text-dark small">Email Address</label>
            <input type="email" name="email" id="login-email" class="form-control" placeholder="name@example.com" required>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between">
              <label class="form-label text-dark small">Password</label>
              <a href="{{ url_for('auth.forgot_password') }}" class="small text-primary text-decoration-none">Forgot Password?</a>
            </div>
            <input type="password" name="password" id="login-password" class="form-control" placeholder="••••••••" required>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" name="remember" id="remember">
            <label class="form-check-label text-muted small" for="remember">Remember me on this device</label>
          </div>

          <button type="submit" class="btn btn-primary-gradient w-100 py-2.5 mb-3">Sign In</button>
        </form>

        <div class="text-center mt-3">
          <p class="text-muted small mb-0">Don't have an account? <a href="{{ url_for('auth.register_customer') }}" class="text-primary fw-semibold text-decoration-none">Sign Up</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
