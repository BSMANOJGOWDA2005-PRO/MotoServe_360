{% extends 'base.html' %}

{% block title %}Forgot Password - MotoServe 360{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="glass-card p-4 p-md-5 text-center">
        <h3 class="fw-bold text-dark mb-3">Recover Password</h3>
        <p class="text-muted small mb-4">Enter your registered email address and we'll send you a password reset link.</p>

        <form action="{{ url_for('auth.forgot_password') }}" method="POST">
          <div class="mb-4 text-start">
            <label class="form-label text-dark small">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
          </div>
          <button type="submit" class="btn btn-primary-gradient w-100 mb-3">Send Reset Link</button>
        </form>

        <a href="{{ url_for('auth.login') }}" class="small text-muted text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Back to Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
