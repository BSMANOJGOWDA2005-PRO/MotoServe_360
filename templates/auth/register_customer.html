{% extends 'base.html' %}

{% block title %}Customer Sign Up - MotoServe 360{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="glass-card p-4 p-md-5">
        <div class="text-center mb-4">
          <h3 class="fw-bold text-dark"><i class="fas fa-user-plus text-primary me-2"></i>Customer Registration</h3>
          <p class="text-muted small">Create your account to request fuel, repairs, towing & shop parts</p>
        </div>

        <form action="{{ url_for('auth.register_customer') }}" method="POST">
          <div class="mb-3">
            <label class="form-label text-dark small">Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="Alex Johnson" required>
          </div>

          <div class="mb-3">
            <label class="form-label text-dark small">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="alex@example.com" required>
          </div>

          <div class="mb-3">
            <label class="form-label text-dark small">Phone Number</label>
            <input type="tel" name="phone" class="form-control" placeholder="+91 9876543210" required>
          </div>

          <div class="mb-3">
            <label class="form-label text-dark small">Driving License Number (Optional)</label>
            <input type="text" name="license_number" class="form-control" placeholder="e.g. DL-1420110012345">
          </div>

          <div class="mb-3">
            <label class="form-label text-dark small">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
          </div>

          <div class="mb-4">
            <label class="form-label text-dark small">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
          </div>

          <button type="submit" class="btn btn-primary-gradient w-100 py-2.5 mb-3">Create Customer Account</button>
        </form>

        <div class="text-center mt-3">
          <p class="text-muted small mb-0">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">Sign In</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
