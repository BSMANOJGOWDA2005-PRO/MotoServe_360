{% extends 'base.html' %}

{% block title %}Reset Password - MotoServe 360{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="glass-card p-4 p-md-5">
        <h3 class="fw-bold text-white mb-3 text-center">Set New Password</h3>
        <form action="{{ url_for('auth.reset_password') }}" method="POST">
          <div class="mb-3">
            <label class="form-label text-white small">Registered Email</label>
            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
          </div>
          <div class="mb-4">
            <label class="form-label text-white small">New Password</label>
            <input type="password" name="new_password" class="form-control" placeholder="New Password" required>
          </div>
          <button type="submit" class="btn btn-primary-gradient w-100 mb-3">Reset Password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
