{% extends 'admin/base_admin.html' %}

{% block title %}System Settings - Admin Center{% endblock %}

{% block admin_content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="glass-card p-4 p-md-5">
      <h4 class="fw-bold text-white mb-4"><i class="fas fa-sliders text-danger me-2"></i>Platform System Configurations</h4>

      <form action="{{ url_for('admin.settings') }}" method="POST">
        <div class="mb-3">
          <label class="form-label text-white small">Platform Name</label>
          <input type="text" value="MotoServe 360" class="form-control" readonly>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-6">
            <label class="form-label text-white small">Default Petrol Price (₹/L)</label>
            <input type="number" step="0.1" value="102.50" class="form-control">
          </div>
          <div class="col-6">
            <label class="form-label text-white small">Default Diesel Price (₹/L)</label>
            <input type="number" step="0.1" value="89.20" class="form-control">
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-6">
            <label class="form-label text-white small">Standard Delivery Fee (₹)</label>
            <input type="number" value="50" class="form-control">
          </div>
          <div class="col-6">
            <label class="form-label text-white small">Emergency Priority Surge (₹)</label>
            <input type="number" value="25" class="form-control">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label text-white small">Base Towing Rate (₹/KM)</label>
          <input type="number" value="35" class="form-control">
        </div>

        <div class="d-flex justify-content-between align-items-center border-top border-secondary border-opacity-25 pt-4">
          <a href="{{ url_for('admin.backup_db') }}" class="btn btn-outline-warning">
            <i class="fas fa-database me-1"></i> Trigger DB Backup
          </a>
          <button type="submit" class="btn btn-success fw-bold">Save System Configuration</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
